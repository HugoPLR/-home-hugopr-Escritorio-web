<!DOCTYPE html>
<html lang="es">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Formulario de prueba de HTML5</title>
</head>
<body>
	<h1>Formularios</h1>

	<form action="" method="get">
		<fieldset>
			<legend>Datos personales</legend>
			<p>
				<label for="txtNombre">Nombre:</label>
				<input type="text" id="txtNombre" name="txtNombre" required autofocus>
			</p>
			<p>
				<label for="txtEmail">Correo electrónico:</label>
				<input type="email" id="txtEmail" name="txtEmail" required>
			</p>
			<p>
				<label for="txtURL">URL:</label>
				<input type="url" id="txtURL" name="txtURL" placeholder="Escribe la URL de tu página web personal" size="50">
			</p>
			<p>
				<label for="sCiudad">Ciudad:</label>
				<select id="sCiudad" name="sCiudad">
					<option value="CO">CÓRDOBA</option>
					<option value="SE" selected>SEVILLA</option>
					<option value="HU">HUELVA</option>
					<option value="CA">CÁDIZ</option>
					<option value="MA">MÁLAGA</option>
					<option value="GR">GRANADA</option>
					<option value="AL">ALMERÍA</option>
					<option value="JA">JAÉN</option>
				</select>
			</p>
		</fieldset>

		<fieldset>
			<legend>Otros datos</legend>
			<p>
				<label for="txtFecha">Fecha:</label>
				<input type="date" id="txtFecha" name="txtFecha" placeholder="dd/mm/aaaa">
			</p>
			<p>
				<label for="txtTiempo">Tiempo:</label>
				<input type="time" id="txtTiempo" name="txtTiempo" placeholder="--:--">
			</p>
			<p>
				<label for="fechayhora">Fecha y hora:</label>
				<input type="datetime-local" id="fechayhora" name="fechayhora">
			</p>
			<p>
				<label for="mes">Mes:</label>
				<input type="month" id="mes" name="mes">
			</p>
			<p>
				<label for="semana">Semana:</label>
				<input type="week" id="semana" name="semana">
			</p>
			<p>
				<label for="numero">Número (min -10, max 10):</label>
				<input type="number" id="numero" name="numero" min="-10" max="10" placeholder="0">
			</p>
			<p>
				<label for="telefono">Teléfono:</label>
				<input type="tel" id="telefono" name="telefono">
			</p>
			<p>
				<label for="termbusc">Término de búsqueda:</label>
				<input type="search" id="termbusc" name="termbusc">
			</p>
			<p>
				<label for="color">Color favorito:</label>
				<input type="color" id="color" name="color">
			</p>
		</fieldset>

		<fieldset>
			<legend>Otros controles</legend>
			<p>
				Aficiones 
				<input type="checkbox" id="cine" name="aficiones" value="1" checked>
				<label for="cine">Cine</label>
				<input type="checkbox" id="deporte" name="aficiones" value="1">
				<label for="deporte">Deporte</label>
			</p>
			<p>
				Forma de pago<br>
				<input type="radio" id="visa" name="formapago" value="V">
				<label for="visa">Visa</label>
				<input type="radio" id="amex" name="formapago" value="A">
				<label for="amex">American Express</label>
				<input type="radio" id="mastercard" name="formapago" value="M">
				<label for="mastercard">MasterCard</label>
			</p>
		</fieldset>

		<p>
			<input type="submit" value="Enviar">
			<input type="reset" value="Borrar">
		</p>
	</form>
</body>
</html>
